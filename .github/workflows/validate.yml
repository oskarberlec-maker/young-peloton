name: Validate Young Peloton
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: python -m unittest discover -s scripts/source-sync -p 'test_*.py' -v
      - run: python scripts/source-sync/build-detail-index.py --check
      # TanStack Router generates its typed route tree during the build.
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
