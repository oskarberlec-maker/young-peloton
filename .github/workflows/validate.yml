name: Validate Young Peloton
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@11
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: npm test
