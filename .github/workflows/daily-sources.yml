name: Daily race source sync
on:
  schedule:
    - cron: '17 4 * * *'
    # Fallback triggers if GitHub delays/drops the primary scheduled event.
    # The guard skips these after a complete live publication on the same day.
    - cron: '47 6,8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/source-sync/**'
      - '.github/workflows/daily-sources.yml'
permissions:
  contents: write
concurrency:
  group: daily-race-source-sync
  cancel-in-progress: false
jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previous successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/source-sync/publish.py restore
      - name: Check whether today's scheduled scan is already published
        id: schedule
        run: python scripts/source-sync/schedule_guard.py
      - name: Install bounded PDF text reader
        if: steps.schedule.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test readers and update rules
        if: steps.schedule.outputs.run == 'true'
        run: python -m unittest discover -s scripts/source-sync -p 'test_*.py' -v
      - name: Check stored sources for confirmed 2027 dates
        if: steps.schedule.outputs.run == 'true'
        run: python scripts/source-sync/run.py --workers 24
      - name: Publish verified changes and audit history
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/source-sync/publish.py publish
      - uses: actions/upload-artifact@v4
        if: always() && steps.schedule.outputs.run == 'true'
        with:
          name: source-sync-report
          path: |
            sync-data/status.json
            sync-data/history.json
            sync-data/report.json
          retention-days: 30
